[package]
name = "mollycloud"
version = "0.2.0"
description = "MollyCloud Live2D desktop companion"
authors = ["MollyCloud"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mollycloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
netspeed-smoke = ["tauri/custom-protocol", "molly-netspeed/test-hooks"]
recharge-smoke = ["tauri/custom-protocol"]
plugin-smoke = ["tauri/custom-protocol"]
skills-smoke = ["molly-skills/test-hooks", "tauri/custom-protocol"]
ccswitch-smoke = ["molly-ccswitch/test-hooks", "tauri/custom-protocol"]
console-settings-smoke = ["tauri/custom-protocol"]
image-workbench-smoke = ["tauri/custom-protocol"]
screen-smoke = ["tauri/custom-protocol"]
image-native-smoke = ["image-workbench-smoke"]

[[example]]
name = "netspeed_smoke"
required-features = ["netspeed-smoke"]

[[example]]
name = "recharge_smoke"
required-features = ["recharge-smoke"]

[[example]]
name = "skills_smoke"
required-features = ["skills-smoke"]

[[example]]
name = "ccswitch_smoke"
required-features = ["ccswitch-smoke"]

[[example]]
name = "console_settings_smoke"
required-features = ["console-settings-smoke"]

[[example]]
name = "image_workbench_smoke"
required-features = ["image-workbench-smoke"]

[[example]]
name = "plugin_smoke"
required-features = ["plugin-smoke"]

[[example]]
name = "screen_smoke"
required-features = ["screen-smoke"]

[[example]]
name = "image_native_smoke"
required-features = ["image-native-smoke"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
molly-skills = { path = "../../vendor/skills-manager/backend" }
molly-ccswitch = { path = "../../vendor/cc-switch/backend" }
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "unstable", "macos-private-api"] }
wry = { version = "0.55", default-features = false, features = ["os-webview"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
arboard = { version = "3", default-features = false }
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
lettre = { version = "0.11", features = ["smtp-transport", "builder", "native-tls"] }
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "sync", "time"] }
url = "2"
[target.'cfg(windows)'.dependencies]
molly-netspeed = { path = "../../vendor/netspeed-dynamic/backend" }
winreg = "0.52"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_JobObjects",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
aes-gcm = "0.10"
shell-words = "1"
# ZIP dependencies enable XZ; link its runtime statically so the app runs without Homebrew.
xz2 = { version = "0.1", features = ["static"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
