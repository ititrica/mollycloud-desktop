[package]
name = "mollycloud"
version = "0.1.2"
description = "MollyCloud Live2D desktop companion"
authors = ["MollyCloud"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mollycloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
ccswitch-smoke = ["molly-ccswitch/test-hooks", "tauri/custom-protocol"]
console-settings-smoke = ["tauri/custom-protocol"]
image-workbench-smoke = ["tauri/custom-protocol"]

[[example]]
name = "ccswitch_smoke"
required-features = ["ccswitch-smoke"]

[[example]]
name = "console_settings_smoke"
required-features = ["console-settings-smoke"]

[[example]]
name = "image_workbench_smoke"
required-features = ["image-workbench-smoke"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
molly-ccswitch = { path = "../../vendor/cc-switch/backend" }
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
arboard = { version = "3", default-features = false }
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
lettre = { version = "0.11", features = ["smtp-transport", "builder", "native-tls"] }
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "sync", "time"] }
url = "2"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
